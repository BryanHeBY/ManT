[package]
name = "mant-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mant-ast = { path = "../crates/mant-ast" }
mant-core = { path = "../crates/mant-core" }

[[bin]]
name = "markdown_parse"
path = "fuzz_targets/markdown_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown_pipeline"
path = "fuzz_targets/markdown_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tldr_page"
path = "fuzz_targets/tldr_page.rs"
test = false
doc = false
bench = false

# Standalone root: the main workspace pins release settings that do not
# apply to libFuzzer instrumentation builds.
[workspace]
members = ["."]
