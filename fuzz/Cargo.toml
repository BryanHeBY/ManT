[package]
name = "mant-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
libmandoc-rs = { path = "../crates/libmandoc-rs", features = ["render"] }
mant-engine = { path = "../crates/mant-engine" }
mant-protocol = { path = "../crates/mant-protocol" }

[[bin]]
name = "markdown_parse"
path = "fuzz_targets/markdown_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown_pipeline"
path = "fuzz_targets/markdown_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tldr_page"
path = "fuzz_targets/tldr_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roff_pipeline"
path = "fuzz_targets/roff_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_query"
path = "fuzz_targets/catalog_query.rs"
test = false
doc = false
bench = false

# Standalone root: the main workspace pins release settings that do not
# apply to libFuzzer instrumentation builds.
[workspace]
members = ["."]
