[package]
name = "mant-render-ir-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Report rendering must not inherit application, loading, or native features.
[workspace]
resolver = "3"

[dependencies]
mant-render = { path = "../../../crates/mant-render", default-features = false }
mant-ir = { path = "../../../crates/mant-ir" }
mant-protocol = { path = "../../../crates/mant-protocol" }
serde_json = "1.0"
