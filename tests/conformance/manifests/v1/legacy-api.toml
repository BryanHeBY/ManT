[[consumer]]
id = "mant-engine-runtime"
paths = ["crates/mant-engine/src/mandoc/mod.rs"]
uses = ["Parser::parse_bytes", "Document", "Node", "Diagnostic", "SpecialCharacter"]
destination = "M8 mantdoc traversal adapter and direct lowerer migration"
owner = "mantdoc-engine-integration"

[[consumer]]
id = "mant-engine-lowerers"
paths = ["crates/mant-engine/src/mandoc/blocks.rs", "crates/mant-engine/src/mandoc/inline.rs", "crates/mant-engine/src/mandoc/layout.rs", "crates/mant-engine/src/mandoc/navigation.rs", "crates/mant-engine/src/mandoc/roff_escape.rs"]
uses = ["Node recursive fields", "table and equation fields", "normalized flags"]
destination = "M8 NodeRef-based lowering"
owner = "mantdoc-engine-integration"

[[consumer]]
id = "profiles-and-audits"
paths = ["crates/mant-engine/examples/roff_structure_profile.rs", "scripts/audit-roff-fidelity.py"]
uses = ["Parser", "AST", "special_character"]
destination = "M8 profile adapter and M10 audit replay"
owner = "mantdoc-conformance"

[[consumer]]
id = "fuzz-roff-pipeline"
paths = ["fuzz/fuzz_targets/roff_pipeline.rs"]
uses = ["Parser", "Renderer"]
destination = "M9 native renderer and M10 pipeline fuzz target"
owner = "mantdoc-fuzz"

[[consumer]]
id = "workspace-ci-and-package"
paths = [".github/workflows/ci.yml", "scripts/check.sh", "scripts/check-libmandoc-symbols.sh", "scripts/check-packaged-crates.sh", "scripts/publish-crates.sh"]
uses = ["C build, symbols, native features, package order"]
destination = "M11 Rust-only CI, package, release and supply-chain checks"
owner = "mantdoc-removal"

[[consumer]]
id = "release-license-and-docs"
paths = ["THIRD_PARTY_NOTICES.md", "docs/releasing.md", "docs/architecture/native-engine.md", "crates/mant/README.md"]
uses = ["vendored mandoc license and libmandoc provenance"]
destination = "M11 removal migration and historical-provenance review"
owner = "mantdoc-removal"
