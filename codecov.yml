# Coverage is a signal, not a gate: an unreleased solo project should not block
# work on a percentage, so status checks are informational and never fail a PR.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# The single Rust upload covers the parser, IR, protocol, CLI, and terminal UI crates.
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: rust
      paths:
        - crates/

comment:
  layout: "reach, flags, files"
  require_changes: true
