[package]
name = "mant-codec"
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Memory-only Markdown and optional roff codecs for ManT semantic IR"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "mdoc", "roff", "markdown", "parser"]
categories = ["parser-implementations", "text-processing"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
roff = ["dep:libmandoc-rs"]

[dependencies]
libmandoc-rs = { path = "../libmandoc-rs", version = "^0.11.0", optional = true }
mant-ir = { path = "../mant-ir", version = "^0.11.0" }
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
