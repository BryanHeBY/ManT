[package]
name = "mant-codec"
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Memory-only Markdown and optional roff codecs for ManT semantic IR"
repository.workspace = true
readme = "README.md"
keywords = ["man", "mdoc", "roff", "markdown", "parser"]
categories = ["parser-implementations", "text-processing"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
roff = ["dep:libmandoc-rs"]

[dependencies]
libmandoc-rs = { path = "../libmandoc-rs", version = "^0.15.0", optional = true, default-features = false, features = ["compat-pandoc", "compat-libbsd", "compat-gnu-eqn"] }
mant-ir = { path = "../mant-ir", version = "^0.14.1" }
pulldown-cmark = { workspace = true, features = ["html"] }
dom_query = { version = "0.30", default-features = false }
html5ever = "0.40"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-normalization = "0.1.26"

[lints]
workspace = true
