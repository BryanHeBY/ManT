[package]
name = "mant-engine"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Structured manual and Markdown document engine used by ManT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "mdoc", "roff", "markdown", "parser"]
categories = ["parser-implementations", "text-processing"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/benches/**", "/src/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
tldr-update = []

[dependencies]
grep-matcher.workspace = true
grep-regex.workspace = true
flate2.workspace = true
mantdoc = { path = "../mantdoc", version = "^0.1.0-alpha.1" }
mant-ir = { path = "../mant-ir", version = "^0.10.0" }
mant-protocol = { path = "../mant-protocol", version = "^0.10.0" }
mant-sources = { path = "../mant-sources", version = "^0.9.0" }
pulldown-cmark.workspace = true
regex-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
zstd.workspace = true

[lints]
workspace = true

[[bench]]
name = "manual_pipeline"
harness = false
