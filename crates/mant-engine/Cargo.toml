[package]
name = "mant-engine"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Structured manual and Markdown document engine used by ManT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "mdoc", "roff", "markdown", "parser"]
categories = ["parser-implementations", "text-processing"]
include = [
  "/Cargo.toml", "/LICENSE", "/README.md", "/src/**",
  "/tests/roff_lowering.rs", "/tests/roff_lowering/**",
  "/tests/markdown_pipeline.rs", "/tests/markdown_pipeline/**",
  "/tests/definition_normalization_layout.rs",
  "/tests/query_report_boundary.rs",
  "/tests/report_composition.rs", "/tests/report_composition/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["roff"]
roff = ["mant-loader/roff", "mant-codec/roff"]

[dependencies]
mant-ir = { path = "../mant-ir", version = "^0.11.0" }
mant-codec = { path = "../mant-codec", version = "^0.11.0", default-features = false }
mant-loader = { path = "../mant-loader", version = "^0.11.0", default-features = false }
mant-query = { path = "../mant-query", version = "^0.11.0", default-features = false }
mant-protocol = { path = "../mant-protocol", version = "^0.11.0" }

[dev-dependencies]
mant-render = { path = "../mant-render", version = "^0.11.0" }
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
# Cross-pipeline native audit examples remain outside the production loader API.
libmandoc-rs = { path = "../libmandoc-rs", version = "^0.10.0" }
flate2.workspace = true
zstd.workspace = true

[lints]
workspace = true
