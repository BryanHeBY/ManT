[package]
name = "mant-engine"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Structured manual and Markdown document engine used by ManT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "mdoc", "roff", "markdown", "parser"]
categories = ["parser-implementations", "text-processing"]
include = [
  "/Cargo.toml", "/LICENSE", "/README.md", "/src/**",
  "/tests/roff_lowering.rs", "/tests/roff_lowering/**",
  "/tests/markdown_pipeline.rs", "/tests/markdown_pipeline/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
tldr-update = []

[dependencies]
grep-matcher.workspace = true
grep-regex.workspace = true
flate2.workspace = true
libmandoc-rs = { path = "../libmandoc-rs", version = "^0.10.0" }
mant-ir = { path = "../mant-ir", version = "^0.11.0" }
mant-protocol = { path = "../mant-protocol", version = "^0.11.0" }
mant-sources = { path = "../mant-sources", version = "^0.9.3" }
pulldown-cmark.workspace = true
regex-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
