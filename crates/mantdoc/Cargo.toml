[package]
name = "mantdoc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# The package combines Apache-2.0 Rust code with the ISC-licensed mandoc
# special-character catalog documented in THIRD_PARTY_NOTICES.md.
license = "Apache-2.0 AND ISC"
publish.workspace = true
description = "Native Rust parser for roff, man, mdoc, tbl, and eqn sources"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "mdoc", "roff", "parser", "mandoc"]
categories = ["parser-implementations", "text-processing"]
include = [
  "/Cargo.toml",
  "/LICENSE",
  "/LICENSES/**",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/benches/**",
  "/src/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde"]
gzip = ["dep:flate2"]
zstd = ["dep:zstd"]
render = ["dep:unicode-width"]

[dependencies]
flate2 = { workspace = true, optional = true }
memchr.workspace = true
num-traits.workspace = true
serde = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }

[dev-dependencies]
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
zstd.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
branches_sharing_code = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
unnecessary_struct_initialization = "warn"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "render"
harness = false
required-features = ["render"]

[[bench]]
name = "compare"
harness = false
required-features = ["render"]

[[bench]]
name = "render_html_groups"
harness = false
required-features = ["render"]
