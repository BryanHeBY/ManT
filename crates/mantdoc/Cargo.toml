[package]
name = "mantdoc"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Native Rust parser for roff, man, mdoc, tbl, and eqn sources"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "mdoc", "roff", "parser", "mandoc"]
categories = ["parser-implementations", "text-processing"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/benches/parse.rs", "/src/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde"]
gzip = ["dep:flate2"]
zstd = ["dep:zstd"]
render = ["dep:unicode-width"]

[dependencies]
flate2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }

[dev-dependencies]
flate2.workspace = true
serde_json.workspace = true
zstd.workspace = true

[lints]
workspace = true

[[bench]]
name = "parse"
harness = false
