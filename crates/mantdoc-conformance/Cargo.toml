[package]
name = "mantdoc-conformance"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Unpublished canonical differential and corpus harness for mantdoc"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[features]
default = []
# Native M9 observation tool: compare only checksum-pinned upstream renderer
# outputs with the pure-Rust renderer. It does not enable or link the C oracle.
renderer-diff = ["mantdoc/render"]

[dependencies]
flate2.workspace = true
mantdoc = { path = "../mantdoc", version = "=0.1.0-alpha.1" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true

[lints]
workspace = true

[[bin]]
name = "mantdoc-render-diff"
path = "src/bin/mantdoc-render-diff.rs"
required-features = ["renderer-diff"]
