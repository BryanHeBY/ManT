[package]
name = "mant-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Structured manual and Markdown document engine used by ManT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "mdoc", "roff", "markdown", "parser"]
categories = ["parser-implementations", "text-processing"]
include = ["/Cargo.toml", "/README.md", "/src/**"]

[dependencies]
grep-matcher.workspace = true
grep-regex.workspace = true
mant-ast = { path = "../mant-ast", version = "=0.6.0" }
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libmandoc-rs = { path = "../libmandoc-rs", version = "=0.6.0" }

[lints]
workspace = true
