[package]
name = "libmandoc-rs"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND ISC AND BSD-2-Clause AND BSD-3-Clause"
description = "Safe, owned Rust interface to the vendored libmandoc parser"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "mdoc", "roff", "mandoc", "parser"]
categories = ["parser-implementations", "text-processing"]
include = [
  "/Cargo.toml",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/LICENSES/**",
  "/build.rs",
  "/config/**",
  "/shim/**",
  "/src/**",
  "/tests/**",
  "/vendor/mandoc-1.14.6/**",
  "!/vendor/mandoc-1.14.6/soelim.c",
  "!/vendor/mandoc-1.14.6/soelim.1",
]
publish.workspace = true
links = "libmandoc_rs"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
render = []
serde = ["dep:serde"]

[dependencies]
flate2.workspace = true
serde = { workspace = true, optional = true }
zstd.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
