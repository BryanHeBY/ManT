[package]
name = "mant"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local-first TUI, structured CLI, and MCP server for manuals and Markdown"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "markdown", "cli", "mcp", "documentation"]
categories = ["command-line-utilities", "text-processing"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/tests/support/display_pty.py"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/mant-{ version }-linux-x64.tar.gz"
bin-dir = "mant-{ version }-linux-x64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/mant-{ version }-linux-arm64.tar.gz"
bin-dir = "mant-{ version }-linux-arm64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/mant-{ version }-windows-x64.zip"
bin-dir = "mant-{ version }-windows-x64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["roff", "tui", "pager", "mcp", "update"]
roff = ["mant-engine/roff"]
tui = ["dep:mant-ui", "dep:ratatui", "dep:crossterm", "dep:arboard", "dep:base64", "dep:signal-hook"]
pager = ["dep:crossterm", "dep:crossbeam-channel", "dep:parking_lot", "dep:regex", "dep:textwrap", "dep:thiserror", "dep:signal-hook"]
mcp = ["dep:rmcp", "dep:rmcp-macros", "dep:tokio"]
update = ["mant-sources/update"]

[dependencies]
anstream.workspace = true
anstyle.workspace = true
arboard = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
clap.workspace = true
crossterm = { workspace = true, optional = true }
crossbeam-channel = { version = "^0.5", optional = true }
parking_lot = { version = "^0.12.1", optional = true }
regex = { version = "^1", optional = true }
textwrap = { version = "~0.16", default-features = false, features = ["unicode-width"], optional = true }
thiserror = { version = "^2", optional = true }
ratatui = { workspace = true, optional = true }
mant-ir = { path = "../mant-ir", version = "^0.11.0" }
mant-protocol = { path = "../mant-protocol", version = "^0.11.0" }
mant-render = { path = "../mant-render", version = "^0.11.0" }
mant-codec = { path = "../mant-codec", version = "^0.11.0", default-features = false }
mant-engine = { path = "../mant-engine", version = "^0.11.0", default-features = false }
mant-loader = { path = "../mant-loader", version = "^0.11.0", default-features = false }
mant-query = { path = "../mant-query", version = "^0.11.0", default-features = false }
mant-sources = { path = "../mant-sources", version = "^0.9.3", default-features = false }
mant-ui = { path = "../mant-ui", version = "^0.11.0", optional = true }
rmcp = { workspace = true, optional = true }
rmcp-macros = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
crossterm_winapi.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true, optional = true }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
