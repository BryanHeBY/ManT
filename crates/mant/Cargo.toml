[package]
name = "mant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local-first TUI, structured CLI, and MCP server for manuals and Markdown"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "markdown", "cli", "mcp", "documentation"]
categories = ["command-line-utilities", "text-processing"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/mant-{ version }-linux-x64.tar.gz"
bin-dir = "mant-{ version }-linux-x64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/mant-{ version }-linux-arm64.tar.gz"
bin-dir = "mant-{ version }-linux-arm64/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/mant-{ version }-windows-x64.zip"
bin-dir = "mant-{ version }-windows-x64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[dependencies]
clap.workspace = true
mant-ir = { path = "../mant-ir", version = "=0.7.1" }
mant-protocol = { path = "../mant-protocol", version = "=0.7.1" }
mant-engine = { path = "../mant-engine", version = "=0.7.1" }
mant-sources = { path = "../mant-sources", version = "=0.7.1", features = ["update"] }
mant-ui = { path = "../mant-ui", version = "=0.7.1" }
rmcp.workspace = true
rmcp-macros.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
crossterm_winapi.workspace = true

[lints]
workspace = true
