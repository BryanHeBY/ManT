[package]
name = "mant-render"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Deterministic document and query report presentation for ManT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "markdown", "documentation", "rendering"]
categories = ["text-processing"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []

[dependencies]
mant-ir = { path = "../mant-ir", version = "^0.11.0" }
mant-protocol = { path = "../mant-protocol", version = "^0.11.0" }
mant-codec = { path = "../mant-codec", version = "^0.11.0", default-features = false }
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[lints]
workspace = true
