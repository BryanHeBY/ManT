[package]
name = "mant-ui"
autobins = false
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Ratatui frontend component for ManT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["man", "markdown", "tui", "ratatui", "documentation"]
categories = ["command-line-utilities", "text-processing"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**"]

[dependencies]
crossterm.workspace = true
mant-ir = { path = "../mant-ir", version = "^0.11.0" }
mant-protocol = { path = "../mant-protocol", version = "^0.11.0" }
crossbeam-channel = "^0.5"
parking_lot = "^0.12.1"
regex = "^1"
textwrap = { version = "~0.16", default-features = false, features = ["unicode-width"] }
thiserror = "^2"
ratatui.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
mant-engine = { path = "../mant-engine", version = "^0.11.0" }
tokio = { version = "^1", features = ["rt"] }

[lints]
workspace = true
