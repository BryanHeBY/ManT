# Builds native distributions, publishes crates, and assembles a draft release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string
      publish_crates:
        description: Publish the tag's crates after environment approval
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Package (${{ matrix.target }})
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: windows-x64
            rust_target: x86_64-pc-windows-msvc
            os: windows-2025
          # macOS remains available as a local source build. Public macOS
          # archives and hosted CI stay disabled until releases can be
          # Developer ID-signed and notarized for Gatekeeper.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # A manual retry may repair release automation after the immutable source
      # tag was created. Keep the helper from the trusted workflow revision
      # separate from the product tree checked out above.
      - name: Check out release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          sparse-checkout: scripts/finalize-cyclonedx.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            zlib1g-dev

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      # Rebuild and test natively on every release target. The checked
      # libmandoc configurations run on both Unix and Windows.
      - name: Build and test Unix release binaries
        if: runner.os != 'Windows'
        run: bash scripts/check.sh

      - name: Build and test Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows.ps1

      - name: Generate Unix CycloneDX SBOM
        if: runner.os != 'Windows'
        shell: bash
        run: |
          SOURCE_DATE_EPOCH=0 cargo cyclonedx \
            --manifest-path crates/mant/Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --describe binaries \
            --all-features \
            --target '${{ matrix.rust_target }}' \
            --target-in-filename
          mkdir -p dist
          sbom="mant-${RELEASE_TAG#v}-${{ matrix.target }}.cdx.json"
          mv "crates/mant/mant_bin_${{ matrix.rust_target }}.cdx.json" "dist/$sbom"
          node .release-automation/scripts/finalize-cyclonedx.mjs "dist/$sbom"
          (cd dist && sha256sum "$sbom" > "$sbom.sha256")
          echo "MANT_SBOM_PATH=dist/$sbom" >> "$GITHUB_ENV"

      - name: Generate Windows CycloneDX SBOM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = "0"
          cargo cyclonedx `
            --manifest-path crates/mant/Cargo.toml `
            --format json `
            --spec-version 1.5 `
            --describe binaries `
            --all-features `
            --target '${{ matrix.rust_target }}' `
            --target-in-filename
          New-Item dist -ItemType Directory -Force | Out-Null
          $Version = $env:RELEASE_TAG.Substring(1)
          $SbomName = "mant-$Version-${{ matrix.target }}.cdx.json"
          $Sbom = Join-Path "dist" $SbomName
          Move-Item "crates/mant/mant_bin_${{ matrix.rust_target }}.cdx.json" $Sbom
          node .release-automation/scripts/finalize-cyclonedx.mjs $Sbom
          $Hash = (Get-FileHash $Sbom -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$Sbom.sha256",
            "$Hash  $SbomName`n",
            [Text.UTF8Encoding]::new($false)
          )
          "MANT_SBOM_PATH=$Sbom" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Unix release archive
        if: runner.os != 'Windows'
        run: bash scripts/package-release.sh
        env:
          MANT_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          MANT_RELEASE_TARGET: ${{ matrix.target }}

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1
        env:
          MANT_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          MANT_RELEASE_TARGET: ${{ matrix.target }}

      - name: Attest release archive and checksum
        id: attest-release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/mant-*.*

      - name: Stage Unix Sigstore bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          cp "$ATTESTATION_BUNDLE" \
            "dist/mant-${version}-${MANT_RELEASE_TARGET}.sigstore.json"
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-release.outputs.bundle-path }}
          MANT_RELEASE_TARGET: ${{ matrix.target }}

      - name: Stage Windows Sigstore bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = $env:RELEASE_TAG -replace '^v', ''
          $Destination = Join-Path dist "mant-$Version-$env:MANT_RELEASE_TARGET.sigstore.json"
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination $Destination
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-release.outputs.bundle-path }}
          MANT_RELEASE_TARGET: ${{ matrix.target }}

      - name: Bind SBOM to Unix archive
        if: runner.os != 'Windows'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/mant-*.tar.gz
          sbom-path: ${{ env.MANT_SBOM_PATH }}

      - name: Bind SBOM to Windows archive
        if: runner.os == 'Windows'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/mant-*.zip
          sbom-path: ${{ env.MANT_SBOM_PATH }}

      - name: Upload packaged distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mant-${{ matrix.target }}
          path: |
            dist/mant-*.tar.gz
            dist/mant-*.tar.gz.sha256
            dist/mant-*.zip
            dist/mant-*.zip.sha256
            dist/mant-*.cdx.json
            dist/mant-*.cdx.json.sha256
            dist/mant-*.sigstore.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-crates:
    name: Publish crates.io packages
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_crates)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install native publishing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            zlib1g-dev

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Exchange the GitHub identity for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the lockstep crate graph
        run: bash scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          MANT_RELEASE_TAG: ${{ env.RELEASE_TAG }}

  draft:
    name: Create draft GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download every platform archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mant-*
          path: release
          merge-multiple: true

      - name: Assemble checksum manifest
        shell: bash
        run: cat release/*.sha256 > release/SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS

      # Keep the release private until its generated notes and complete asset
      # set have been reviewed in the GitHub UI. Publishing is a deliberate
      # human action and does not require rebuilding any artifact.
      - name: Create draft release
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release/*.tar.gz \
            release/*.zip \
            release/*.cdx.json \
            release/*.sigstore.json \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            --draft \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
