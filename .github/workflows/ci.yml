# Verifies every source boundary used by ManT without publishing artifacts.
name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

# A pull request only needs to read the checked-out repository. Keep release
# permissions out of this workflow so untrusted changes cannot publish data.
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_MSRV: 1.88.0

jobs:
  scope:
    name: Plan CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.plan.outputs.run_full }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fast-forward from dev to main carries the exact same tree and check
      # suite. Reuse it only after the API confirms every full CI job passed
      # for this SHA; direct main pushes and all other events still run fully.
      - name: Decide whether this commit needs full CI
        id: plan
        shell: bash
        run: |
          run_full=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if ci_url=$(bash scripts/find-successful-ci.sh "$GITHUB_SHA" dev); then
              run_full=false
              echo "reusing complete dev CI: $ci_url"
            fi
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  supply-chain:
    name: Supply chain
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit advisories, licenses, sources, and dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: stable
          command: check
          arguments: --all-features

      - name: Install cargo-about
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-about@0.9.2
          fallback: none

      - name: Verify distributable Rust dependency notices
        run: |
          cargo fetch --locked
          scripts/generate-rust-licenses.sh "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"
          cmp THIRD_PARTY_LICENSES.html "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html" || {
            echo 'THIRD_PARTY_LICENSES.html is stale; run scripts/generate-rust-licenses.sh' >&2
            exit 1
          }

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  build:
    name: Build (Linux x64)
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # Cache only third-party build products. Workspace and incremental
      # artifacts are cheap to rebuild and made the old cache exceed 1 GiB.
      - name: Cache compiled Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-x64-stable
          workspaces: |
            . -> target
            fuzz -> target
          cache-bin: false
          save-if: ${{ github.event_name == 'push' }}

      # The local script is the canonical verification boundary: formatting,
      # workspace tests, clippy, fuzz compilation, and executable smoke tests.
      # CI uses the already-warm debug profile; tagged releases independently
      # build the optimized binary after proving this exact SHA passed CI.
      - name: Build and test
        run: bash scripts/check.sh --build-profile debug

  native-roff-conformance:
    # This independent Rust-only conformance job starts beside the product
    # boundary so archive verification and parser recovery never wait for
    # packaging, docs, clippy, fuzz compilation, or product smoke tests.
    name: Native roff conformance (Linux x64)
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache compiled Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-x64-stable
          workspaces: |
            . -> target
          cache-bin: false
          save-if: ${{ github.event_name == 'push' }}

      # The runner validates the frozen archive identity and exact decompressed
      # source identities before asserting each native execution, macro-package,
      # preprocessor, AST, and engine-IR contract. Keep payload under the runner
      # temp directory: upstream regressions are conformance evidence, never
      # repository/package contents.
      - name: Check checksum-pinned native roff execution gate
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mandoc-1.14.6.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" https://mandoc.bsd.lv/snapshots/mandoc-1.14.6.tar.gz
          # M3, M4, and M6 are independent whole-corpus checks. M5 and strict
          # M9 renderer comparison add deterministic index-modulo shards. Four
          # shards preserve complete coverage without serializing the parser
          # and renderer gates.
          python3 scripts/run-mantdoc-differential-shards.py "$archive" --shards 4 --jobs 4

  macos-native:
    # Guards the portable Rust parser and product crates on macOS/arm64.
    # Release signing and packaging require certificates and are intentionally
    # out of scope; this needs no secrets.
    name: Native (macOS arm64)
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache compiled Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-arm64-stable
          cache-bin: false
          save-if: ${{ github.event_name == 'push' }}

      - name: Test Rust workspace on macOS
        run: |
          cargo test --locked --workspace
          cargo test --locked --package mantdoc --all-features

  windows-native:
    # Windows exercises the same pure-Rust parser, transport, and manual
    # fixtures as Unix.
    name: Native (Windows x64)
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache compiled Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-x64-stable
          cache-bin: false
          save-if: ${{ github.event_name == 'push' }}

      - name: Build and test portable Windows product
        shell: pwsh
        run: ./scripts/check-windows.ps1 -BuildProfile debug

  rust-msrv:
    name: Rust MSRV (1.88.0)
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install "$RUST_MSRV" --profile minimal

      - name: Cache compiled Cargo dependencies for MSRV
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-x64-msrv
          cache-bin: false
          save-if: ${{ github.event_name == 'push' }}

      # Stable CI executes every test. The MSRV boundary only needs to prove
      # that every product target and feature still compiles on Rust 1.88.
      - name: Check workspace on MSRV
        run: >-
          cargo +"$RUST_MSRV" check --locked --workspace
          --all-targets --all-features

  coverage:
    # Coverage runs beside the canonical build so instrumentation never slows
    # or gates the primary verification path.
    name: Coverage
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - name: Cache compiled Cargo dependencies for coverage
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-x64-coverage
          cache-bin: false
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-llvm-cov

      # --remap-path-prefix rewrites absolute source paths to the repository
      # root, leaving every LCOV source path directly repository-relative.
      - name: Collect Rust coverage
        run: |
          cargo llvm-cov --locked --workspace \
            --remap-path-prefix --lcov --output-path rust-lcov.info

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-lcov.info
          flags: rust
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  complete:
    name: CI verified
    if: always()
    needs:
      - scope
      - supply-chain
      - build
      - native-roff-conformance
      - macos-native
      - windows-native
      - rust-msrv
      - coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require a reused or newly completed full suite
        shell: bash
        run: |
          [[ "$SCOPE_RESULT" == success ]]
          if [[ "$RUN_FULL" == false ]]; then
            echo "exact-SHA full CI was already completed on dev"
            exit 0
          fi
          for result in \
            "$SUPPLY_CHAIN_RESULT" \
            "$BUILD_RESULT" \
            "$NATIVE_ROFF_DIFFERENTIAL_RESULT" \
            "$MACOS_RESULT" \
            "$WINDOWS_RESULT" \
            "$MSRV_RESULT" \
            "$COVERAGE_RESULT"; do
            [[ "$result" == success ]]
          done
        env:
          RUN_FULL: ${{ needs.scope.outputs.run_full }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_ROFF_DIFFERENTIAL_RESULT: ${{ needs.native-roff-conformance.result }}
          MACOS_RESULT: ${{ needs.macos-native.result }}
          WINDOWS_RESULT: ${{ needs.windows-native.result }}
          MSRV_RESULT: ${{ needs.rust-msrv.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
