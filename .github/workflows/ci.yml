# Verifies every source boundary used by ManT without publishing artifacts.
name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

# A pull request only needs to read the checked-out repository. Keep release
# permissions out of this workflow so untrusted changes cannot publish data.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_MSRV: 1.88.0

jobs:
  build:
    name: Build (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            zlib1g-dev

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            fuzz/target
          key: cargo-v1-linux-x64-stable-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            cargo-v1-linux-x64-stable-

      # The local script is the canonical verification boundary: formatting,
      # workspace tests, clippy, a release build, and executable smoke tests.
      - name: Build and test
        run: bash scripts/check.sh

      # Keep the standalone libFuzzer harnesses compiling without adding
      # instrumented fuzz execution to the normal CI runtime.
      - name: Compile fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

      - name: Verify vendored libmandoc matches upstream
        run: bash crates/libmandoc-rs/scripts/sync-vendor --verify

  macos-native:
    # Guards the checked-in macOS C configuration (config/macos.h and its
    # compat sources) against bit-rot. Release signing and packaging require
    # certificates and are intentionally out of scope; this only compiles and
    # tests the native crates on macOS/arm64, which needs no secrets.
    name: Native (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-macos-arm64-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-macos-arm64-stable-

      # Compile and test the native workspace so the macOS target family is
      # exercised on every change, not only at release time. clang ships with
      # the runner image, so libmandoc builds against config/macos.h.
      - name: Test Rust workspace on macOS
        run: cargo test --locked --workspace

      - name: Lint Rust workspace on macOS
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  windows-native:
    # Windows builds the same memory-only libmandoc parser and manual fixtures
    # as Unix while Rust owns source I/O, decompression, and .so redirects.
    name: Native (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
            ~\.cargo\git\db
            target
          key: cargo-v1-windows-x64-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-windows-x64-stable-

      - name: Build and test portable Windows product
        shell: pwsh
        run: ./scripts/check-windows.ps1

  rust-msrv:
    name: Rust MSRV (1.88.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            zlib1g-dev

      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install "$RUST_MSRV" --profile minimal

      - name: Cache Cargo dependencies and MSRV build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_MSRV }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_MSRV }}-

      - name: Test Rust workspace on MSRV
        run: cargo +"$RUST_MSRV" test --locked --workspace

  coverage:
    # Coverage runs beside the canonical build so instrumentation never slows
    # or gates the primary verification path.
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            zlib1g-dev

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-linux-x64-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-linux-x64-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-llvm-cov

      # --remap-path-prefix rewrites absolute source paths to the repository
      # root, leaving every LCOV source path directly repository-relative.
      - name: Collect Rust coverage
        run: |
          cargo llvm-cov --locked --workspace \
            --remap-path-prefix --lcov --output-path rust-lcov.info

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-lcov.info
          flags: rust
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
