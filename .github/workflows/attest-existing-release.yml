# Adds a current maintainer endorsement to release assets that predate the
# tagged build provenance workflow. It does not claim to recreate provenance
# from the original build.
name: Attest Existing Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH release tag to attest
        required: true
        type: string

permissions: {}

concurrency:
  group: attest-existing-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attest:
    name: Endorse ${{ inputs.tag }} release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download existing release archives
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          mkdir release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release \
            --pattern 'mant-*.tar.gz' \
            --pattern 'mant-*.zip'

          mapfile -d '' artifacts < <(
            find release -maxdepth 1 -type f \
              \( -name 'mant-*.tar.gz' -o -name 'mant-*.zip' \) \
              -print0 \
              | sort -z
          )
          if (( ${#artifacts[@]} == 0 )); then
            echo "release has no supported ManT archives: $RELEASE_TAG" >&2
            exit 1
          fi
          sha256sum "${artifacts[@]}" > release/subjects.sha256

          jq -n \
            --arg tag "$RELEASE_TAG" \
            '{
              schema: "https://github.com/BryanHeBY/ManT/attestations/release-asset-endorsement/v1",
              release_tag: $tag,
              assertion: "Current maintainers endorse these existing release assets.",
              limitation: "This is not provenance from the original build."
            }' > release/endorsement.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Sign maintainer endorsement
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/subjects.sha256
          predicate-type: https://github.com/BryanHeBY/ManT/attestations/release-asset-endorsement/v1
          predicate-path: release/endorsement.json

      - name: Attach Sigstore bundle to release
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          asset="mant-${version}-release.sigstore.json"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            | grep -Fqx "$asset"; then
            echo "release asset already exists: $asset" >&2
            exit 1
          fi

          cp "$ATTESTATION_BUNDLE" "release/$asset"
          gh release upload "$RELEASE_TAG" "release/$asset" \
            --repo "$GITHUB_REPOSITORY"
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
