<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 900 960" role="img" aria-labelledby="title description">
  <title id="title">ManT: local sources, shared semantics, independent interfaces</title>
  <desc id="description">Native man, mdoc and roff manuals, Markdown and tldr pages enter mant-loader, then mant-codec. The codec calls libmandoc-rs for a native AST and lowers content into mant-ir. It also encodes document Markdown from IR. The independent mant-engine orchestrates loader and query calls. Queries produce mant-protocol results; mant-render formats IR and results, delegating document Markdown encoding to codec. The TUI consumes IR and shared render styles. The mant host composes these capabilities and owns terminal, JSON and MCP delivery. Solid arrows show content flow; dashed arrows show labeled calls, not crate containment or the complete dependency graph.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
    <marker id="call-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#218bff"/>
    </marker>
    <style>
      .source { fill: #f6f8fa; stroke: #8c959f; }
      .execution { fill: #ddf4ff; stroke: #218bff; }
      .codec { fill: #fbefff; stroke: #a475f9; }
      .ir { fill: #dafbe1; stroke: #2da44e; }
      .protocol { fill: #fff8c5; stroke: #bf8700; }
      .presentation { fill: #ddf8f5; stroke: #1b7c83; }
      .host { fill: #eaeef2; stroke: #6e7781; }
      rect { stroke-width: 1.5; }
      .flow { fill: none; stroke: #6e7781; stroke-width: 2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .call { fill: none; stroke: #218bff; stroke-width: 1.75; stroke-dasharray: 5 5; marker-end: url(#call-arrow); }
      .call-stem { marker-end: none; }
      .title { fill: #1f2328; font: 650 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .detail { fill: #424a53; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #57606a; font: 650 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .call-label { fill: #0969da; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ir-title { fill: #1a7f37; font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .source { fill: #161b22; stroke: #6e7681; }
        .execution { fill: #0d2033; stroke: #58a6ff; }
        .codec { fill: #271b36; stroke: #bc8cff; }
        .ir { fill: #173b24; stroke: #3fb950; }
        .protocol { fill: #3b2e0b; stroke: #d29922; }
        .presentation { fill: #123536; stroke: #56d4c7; }
        .host { fill: #21262d; stroke: #8b949e; }
        .flow { stroke: #8b949e; }
        .call { stroke: #58a6ff; }
        #arrow path { fill: #8b949e; }
        #call-arrow path { fill: #58a6ff; }
        .title { fill: #f0f6fc; }
        .detail, .label { fill: #b1bac4; }
        .call-label { fill: #58a6ff; }
        .ir-title { fill: #56d364; }
      }
    </style>
  </defs>

  <text x="30" y="28" class="label">LOCAL SOURCES</text>
  <rect x="30" y="45" width="260" height="76" rx="12" class="source"/>
  <rect x="320" y="45" width="260" height="76" rx="12" class="source"/>
  <rect x="610" y="45" width="260" height="76" rx="12" class="source"/>
  <g text-anchor="middle">
    <text x="160" y="76" class="title">Native manuals</text>
    <text x="160" y="102" class="detail">man · mdoc · roff</text>
    <text x="450" y="76" class="title">Markdown</text>
    <text x="450" y="102" class="detail">personal · managed sources</text>
    <text x="740" y="76" class="title">tldr pages</text>
    <text x="740" y="102" class="detail">installed local content</text>
  </g>
  <!-- All source lanes terminate at the loader, never at the orchestrator. -->
  <path d="M 160 121 V 148 H 380 V 180" class="flow"/>
  <path d="M 450 121 V 180" class="flow"/>
  <path d="M 740 121 V 148 H 520 V 180" class="flow"/>

  <rect x="300" y="180" width="300" height="76" rx="12" class="execution"/>
  <text x="450" y="211" text-anchor="middle" class="title">mant-loader</text>
  <text x="450" y="237" text-anchor="middle" class="detail">discover · bounded reads · scope</text>
  <text x="635" y="211" class="detail">Markdown registry:</text>
  <text x="635" y="237" class="title">mant-sources</text>
  <path d="M 450 256 V 310" class="flow"/>
  <text x="465" y="289" class="detail">input content</text>

  <rect x="30" y="180" width="220" height="100" rx="12" class="execution"/>
  <text x="140" y="211" text-anchor="middle" class="title">mant-engine</text>
  <text x="140" y="237" text-anchor="middle" class="detail">validate requests</text>
  <text x="140" y="262" text-anchor="middle" class="detail">compose load + query</text>
  <path d="M 250 218 H 300" class="call"/>
  <!-- A gap distinguishes the crossing from a junction with the IR flow. -->
  <path d="M 250 256 H 275 V 496" class="call call-stem"/>
  <path d="M 275 514 V 622 H 300" class="call"/>
  <text x="30" y="319" class="label">INDEPENDENT CRATES</text>
  <path d="M 30 345 H 78" class="flow"/>
  <text x="90" y="350" class="detail">content flow</text>
  <path d="M 30 375 H 78" class="call"/>
  <text x="90" y="380" class="detail">calls / orchestration</text>

  <rect x="300" y="310" width="300" height="90" rx="12" class="codec"/>
  <text x="450" y="337" text-anchor="middle" class="title">mant-codec</text>
  <text x="450" y="362" text-anchor="middle" class="detail">decode · semantic lowering</text>
  <text x="450" y="386" text-anchor="middle" class="detail">document Markdown encoding</text>
  <rect x="670" y="300" width="200" height="100" rx="12" class="codec"/>
  <text x="770" y="330" text-anchor="middle" class="title">libmandoc-rs</text>
  <text x="770" y="357" text-anchor="middle" class="detail">native roff parser</text>
  <text x="770" y="383" text-anchor="middle" class="detail">owned AST</text>
  <path d="M 600 332 H 670" class="call"/>
  <text x="635" y="320" text-anchor="middle" class="call-label">parse</text>
  <path d="M 670 378 H 600" class="flow"/>
  <text x="635" y="367" text-anchor="middle" class="detail">AST</text>

  <path d="M 450 400 V 450" class="flow both"/>
  <text x="465" y="430" class="detail">decode / encode</text>
  <rect x="300" y="450" width="300" height="110" rx="14" class="ir"/>
  <text x="450" y="482" text-anchor="middle" class="ir-title">mant-ir</text>
  <text x="450" y="509" text-anchor="middle" class="title">Shared semantic model</text>
  <text x="450" y="537" text-anchor="middle" class="detail">content · entries · typed links</text>
  <path d="M 450 560 V 590" class="flow"/>
  <rect x="300" y="590" width="300" height="64" rx="12" class="execution"/>
  <text x="450" y="617" text-anchor="middle" class="title">mant-query</text>
  <text x="450" y="641" text-anchor="middle" class="detail">select · search · explain</text>
  <path d="M 450 654 V 710" class="flow"/>

  <!-- Direct IR consumers bypass query execution and serialization. -->
  <path d="M 300 505 H 145 V 710" class="flow"/>
  <text x="158" y="575" class="detail">document IR</text>
  <path d="M 600 505 H 755 V 710" class="flow"/>
  <text x="768" y="575" class="detail">body IR</text>
  <rect x="30" y="710" width="230" height="90" rx="12" class="presentation"/>
  <text x="145" y="739" text-anchor="middle" class="title">mant-ui</text>
  <text x="145" y="764" text-anchor="middle" class="detail">interactive layout</text>
  <text x="145" y="788" text-anchor="middle" class="detail">IR + shared render styles</text>
  <rect x="300" y="710" width="300" height="90" rx="12" class="protocol"/>
  <text x="450" y="739" text-anchor="middle" class="title">mant-protocol</text>
  <text x="450" y="764" text-anchor="middle" class="detail">query results · DTOs</text>
  <text x="450" y="788" text-anchor="middle" class="detail">shared contracts + labels</text>
  <rect x="650" y="710" width="220" height="90" rx="12" class="presentation"/>
  <text x="760" y="739" text-anchor="middle" class="title">mant-render</text>
  <text x="760" y="764" text-anchor="middle" class="detail">body + report formats</text>
  <text x="760" y="788" text-anchor="middle" class="detail">shared styles + cells</text>
  <path d="M 600 755 H 650" class="flow"/>

  <path d="M 145 800 V 848" class="flow"/>
  <path d="M 450 800 V 848" class="flow"/>
  <path d="M 760 800 V 848" class="flow"/>
  <rect x="30" y="848" width="840" height="90" rx="14" class="host"/>
  <text x="145" y="876" text-anchor="middle" class="title">TUI sessions</text>
  <text x="450" y="876" text-anchor="middle" class="title">CLI / request JSON</text>
  <text x="760" y="872" text-anchor="middle" class="title">Text / Markdown</text>
  <text x="760" y="894" text-anchor="middle" class="detail">CLI / MCP</text>
  <text x="450" y="921" text-anchor="middle" class="detail">mant · composition root · terminal / pager / clipboard · JSON / MCP delivery</text>
</svg>
