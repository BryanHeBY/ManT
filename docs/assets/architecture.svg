<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" role="img" aria-labelledby="title description">
  <title id="title">ManT architecture</title>
  <desc id="description">Native manuals, Markdown, and tldr enter mant-engine around its mant-ir semantic center. A thin mant-protocol interaction layer supplies logical projections to TUI host interactions, CLI and request JSON, and compact MCP presentation. Separate direct paths carry document IR to the TUI and human renderers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
    <style>
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .engine { fill: #f6f8fa; stroke: #54aeff; stroke-width: 2; }
      .stage { fill: #ffffff; stroke: #b6c2cf; stroke-width: 1.25; }
      .ir { fill: #dafbe1; stroke: #2da44e; stroke-width: 2; }
      .protocol { fill: #fff8c5; stroke: #bf8700; stroke-width: 2; }
      .connector { fill: none; stroke: #8c959f; stroke-width: 2; marker-end: url(#arrow); }
      .protocol-connector { fill: none; stroke: #bf8700; stroke-width: 1.75; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .arrow-head { fill: #8c959f; }
      .label { fill: #57606a; font: 650 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; }
      .title { fill: #1f2328; font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .detail { fill: #57606a; font: 13px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .engine-title { fill: #0969da; font: 700 21px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .ir-title { fill: #1a7f37; font: 700 22px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .protocol-title { fill: #9a6700; font: 700 18px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .interface-title { fill: #1f2328; font: 650 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .card, .stage { fill: #161b22; stroke: #30363d; }
        .engine { fill: #0d2033; stroke: #1f6feb; }
        .ir { fill: #173b24; stroke: #2ea043; }
        .protocol { fill: #3b2e0b; stroke: #d29922; }
        .connector { stroke: #6e7681; }
        .protocol-connector { stroke: #d29922; }
        .arrow-head { fill: #6e7681; }
        .label, .detail { fill: #8b949e; }
        .title { fill: #f0f6fc; }
        .engine-title { fill: #58a6ff; }
        .ir-title { fill: #56d364; }
        .protocol-title { fill: #e3b341; }
        .interface-title { fill: #f0f6fc; }
      }
    </style>
  </defs>

  <text x="35" y="27" class="label">SOURCE ADAPTERS</text>

  <g filter="url(#shadow)">
    <rect x="35" y="45" width="250" height="80" rx="12" class="card"/>
    <rect x="325" y="45" width="250" height="80" rx="12" class="card"/>
    <rect x="615" y="45" width="250" height="80" rx="12" class="card"/>
  </g>
  <text x="160" y="77" text-anchor="middle" class="title">Native manuals</text>
  <text x="160" y="103" text-anchor="middle" class="detail">ManualIndex · mantdoc</text>
  <text x="450" y="77" text-anchor="middle" class="title">Markdown</text>
  <text x="450" y="103" text-anchor="middle" class="detail">mant-sources · parser</text>
  <text x="740" y="77" text-anchor="middle" class="title">tldr caches</text>
  <text x="740" y="103" text-anchor="middle" class="detail">tldr parser · attribution</text>

  <path d="M 160 125 L 210 215" class="connector"/>
  <path d="M 450 125 L 450 215" class="connector"/>
  <path d="M 740 125 L 690 215" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="75" y="165" width="750" height="310" rx="18" class="engine"/>
  </g>
  <text x="105" y="199" class="engine-title">mant-engine</text>
  <text x="795" y="198" text-anchor="end" class="detail">execution layer</text>

  <g>
    <rect x="110" y="215" width="200" height="62" rx="10" class="stage"/>
    <rect x="350" y="215" width="200" height="62" rx="10" class="stage"/>
    <rect x="590" y="215" width="200" height="62" rx="10" class="stage"/>
  </g>
  <text x="210" y="241" text-anchor="middle" class="title">Resolve</text>
  <text x="210" y="261" text-anchor="middle" class="detail">bounded local sources</text>
  <text x="450" y="241" text-anchor="middle" class="title">Lower</text>
  <text x="450" y="261" text-anchor="middle" class="detail">normalize all syntax</text>
  <text x="690" y="241" text-anchor="middle" class="title">Compose</text>
  <text x="690" y="261" text-anchor="middle" class="detail">manual · tldr</text>

  <path d="M 210 277 L 300 310" class="connector"/>
  <path d="M 450 277 L 450 310" class="connector"/>
  <path d="M 690 277 L 600 310" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="165" y="310" width="570" height="108" rx="15" class="ir"/>
  </g>
  <text x="450" y="346" text-anchor="middle" class="ir-title">mant-ir · semantic center</text>
  <text x="450" y="375" text-anchor="middle" class="title">ResolvedContent · Document · TldrDocument</text>
  <text x="450" y="398" text-anchor="middle" class="detail">typed IDs · links · outline paths · ranges · visitors · index</text>

  <text x="450" y="448" text-anchor="middle" class="detail">project · search · render · validate</text>

  <path d="M 300 418 C 300 500, 85 500, 85 635" class="connector"/>
  <path d="M 600 418 C 600 500, 765 500, 765 635" class="connector"/>
  <path d="M 450 418 L 450 520" class="connector"/>
  <g filter="url(#shadow)">
    <rect x="325" y="520" width="250" height="58" rx="12" class="protocol"/>
  </g>
  <text x="450" y="544" text-anchor="middle" class="protocol-title">mant-protocol</text>
  <text x="450" y="565" text-anchor="middle" class="detail">projections · presentation</text>

  <path d="M 350 578 C 300 610, 210 600, 155 635" class="protocol-connector"/>
  <path d="M 405 578 L 335 635" class="connector"/>
  <path d="M 495 578 L 550 635" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="25" y="635" width="190" height="85" rx="12" class="card"/>
    <rect x="240" y="635" width="190" height="85" rx="12" class="card"/>
    <rect x="455" y="635" width="190" height="85" rx="12" class="card"/>
    <rect x="670" y="635" width="190" height="85" rx="12" class="card"/>
  </g>
  <text x="120" y="661" text-anchor="middle" class="interface-title">Interactive TUI</text>
  <text x="120" y="684" text-anchor="middle" class="detail">document IR</text>
  <text x="120" y="705" text-anchor="middle" class="detail">protocol host DTOs</text>
  <text x="335" y="661" text-anchor="middle" class="interface-title">CLI &amp; request JSON</text>
  <text x="335" y="692" text-anchor="middle" class="detail">queries · schemas</text>
  <text x="550" y="661" text-anchor="middle" class="interface-title">MCP stdio</text>
  <text x="550" y="684" text-anchor="middle" class="detail">read-only tools</text>
  <text x="550" y="705" text-anchor="middle" class="detail">text · CommonMark</text>
  <text x="765" y="661" text-anchor="middle" class="interface-title">Human renderers</text>
  <text x="765" y="684" text-anchor="middle" class="detail">terminal · text</text>
  <text x="765" y="705" text-anchor="middle" class="detail">Markdown · man</text>
</svg>
