# cargo-about is the distribution-time counterpart to deny.toml: cargo-deny
# decides which licenses are acceptable, while this file drives the notice
# bundle shipped with native releases.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Generate one conservative superset for every native archive. Shipping a
# notice that is not needed by one target is harmless; omitting one is not.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
