[workspace]
members = [
  "crates/mant-ir",
  "crates/mant-protocol",
  "crates/mant",
  "crates/mant-engine",
  "crates/mant-sources",
  "crates/mant-ui",
  "crates/mantdoc",
]
default-members = [
  "crates/mant-ir",
  "crates/mant-protocol",
  "crates/mant",
  "crates/mant-engine",
  "crates/mant-sources",
  "crates/mant-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/BryanHeBY/ManT"
homepage = "https://github.com/BryanHeBY/ManT"
publish = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "0.23.1"
clap = { version = "4.6.6", default-features = false, features = ["color", "derive", "error-context", "help", "std", "suggestions", "usage"] }
crossterm = "0.29.0"
crossterm_winapi = "0.9.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
memchr = "2.8.3"
num-traits = { version = "0.2.19", default-features = false }
regex-syntax = "0.8.11"
minus = { version = "5.7.2", default-features = false, features = ["search", "static_output"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Keep the SDK and its generated glue on the same upstream release.
rmcp = { version = "=3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
rmcp-macros = "=3.1.4"
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.0", default-features = false }
tar = { version = "0.4.46", default-features = false }
toml = "1.1"
tokio = { version = "1", default-features = false, features = ["io-std", "io-util", "macros", "rt", "sync"] }
unicode-width = "0.2.2"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.13.3", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
