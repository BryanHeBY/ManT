[workspace]
members = [
  "crates/mant-ast",
  "crates/mant",
  "crates/mant-core",
  "crates/mant-ui",
  "crates/libmandoc-rs",
]
default-members = [
  "crates/mant-ast",
  "crates/mant",
  "crates/mant-core",
  "crates/mant-ui",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/BryanHeBY/ManT"
homepage = "https://github.com/BryanHeBY/ManT"
publish = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
crossterm = "0.29.0"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
pulldown-cmark = { version = "0.13.0", default-features = false }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
# Keep the SDK and its generated glue on the same upstream release.
rmcp = { version = "=2.2.0", default-features = false, features = ["macros", "server", "transport-io"] }
rmcp-macros = "=2.2.0"
schemars = "=1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-std", "io-util", "macros", "rt", "sync"] }
unicode-width = "0.2.2"
zstd = { version = "0.13.3", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
