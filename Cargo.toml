[workspace]
members = [
  "crates/mant-ir",
  "crates/mant-protocol",
  "crates/mant",
  "crates/mant-engine",
  "crates/mant-sources",
  "crates/mant-ui",
  "crates/libmandoc-rs",
]
default-members = [
  "crates/mant-ir",
  "crates/mant-protocol",
  "crates/mant",
  "crates/mant-engine",
  "crates/mant-sources",
  "crates/mant-ui",
]
resolver = "3"

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/BryanHeBY/ManT"
homepage = "https://github.com/BryanHeBY/ManT"
publish = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
crossterm = "0.29.0"
crossterm_winapi = "0.9.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Keep the SDK and its generated glue on the same upstream release.
rmcp = { version = "=3.1.2", default-features = false, features = ["macros", "server", "transport-io"] }
rmcp-macros = "=3.1.2"
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.0", default-features = false }
tar = { version = "0.4.46", default-features = false }
toml = "1.1"
tokio = { version = "1", default-features = false, features = ["io-std", "io-util", "macros", "rt", "sync"] }
unicode-width = "0.2.2"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.13.3", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
